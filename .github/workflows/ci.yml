name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Ruling 618: the suite runs on the userland the app ships on, as an
      # unprivileged user. The image's base is node:26-slim (Debian), and its
      # runtime stage adds git and ca-certificates; the server shells out to
      # rm, chmod and git, and this runner's Ubuntu has other versions of them
      # (its coreutils 9.4 has no `chmod -P`, the image's 9.7 does). Root
      # passes the permission checks the agent-tree suites prove, so the tests
      # run as the runner's own uid, which owns the checkout. `--init` reaps
      # orphans as compose's `init: true` does for the app; the process suites
      # kill a group and wait for its members to go.
      - name: Unit + integration tests (node:26-slim, unprivileged)
        run: |
          docker run --rm --init -v "$PWD:/w" -w /w \
            -e CI -e DEBIAN_FRONTEND=noninteractive \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            node:26-slim sh -euc '
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends git ca-certificates > /dev/null
              exec setpriv --reuid="$HOST_UID" --regid="$HOST_GID" --clear-groups env HOME=/tmp npm test
            '

      - name: Build
        run: npm run build

      - name: Bundle ratchet (ruling 457)
        run: node scripts/measure-routes.mjs --check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end (Playwright)
        run: npm run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
