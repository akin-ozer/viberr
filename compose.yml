services:
  app:
    # Ruling 345: the build stamp the image declares is actually SUPPLIED here.
    # `build-info.server.ts` resolves identity from env first and says that env
    # "is the only source a container can have" — `.dockerignore` excludes
    # `.git`, so its file-reading fallback cannot fire in an image. The
    # Dockerfile has declared these three ARGs since gap 18 and the runbook
    # documented a `--build-arg` incantation, but nothing here passed them — so
    # the default `docker compose build` could not stamp, and every container on
    # this instance reported `revision: null, revisionSource: null,
    # builtAt: null` and a `version` identical for every build of a release.
    #
    # Interpolated with empty defaults, which keeps a bare `docker compose
    # build` working and honestly unstamped. `npm run deploy` is the path that
    # fills them from git and then reads the running instance back.
    build:
      context: .
      args:
        VIBERR_BUILD_VERSION: "${VIBERR_BUILD_VERSION:-}"
        VIBERR_BUILD_SHA: "${VIBERR_BUILD_SHA:-}"
        VIBERR_BUILD_TIME: "${VIBERR_BUILD_TIME:-}"
    # STABLE identity across container recreation (B-FD1): the data-root writer
    # lock records its holder's hostname, and a lock from a DIFFERENT host is
    # refused — the one host it cannot probe for liveness. Compose's default
    # hostname is the container id, so every `down && up` came back as a
    # stranger to its own leftover lock. Pinned, a recreated container probes
    # its predecessor's pid and reclaims a lock the shutdown could not release.
    hostname: viberr
    # F20-2: run an init (PID 1) that reaps orphaned children. The app runs as
    # pid 1, and node-as-init never reaps the grandchildren an aborted SDK run or
    # a killed MCP probe leaves behind — so a boot accumulated defunct
    # chromium/crashpad zombies. docker-init handles every orphan regardless of
    # which layer dropped it; the process-group teardown in resources.server is
    # the belt to this brace.
    init: true
    # Ruling 185 (pass 36): NO `security_opt: seccomp=unconfined` here. It was
    # added for F36-1 — the Codex CLI confined a run with bubblewrap, which
    # needs an unprivileged user namespace Docker's builtin seccomp profile
    # refuses to the non-root app user, so every confined Codex run died at its
    # first shell command. Viberr no longer uses that sandbox at all (every
    # Codex run is `danger-full-access`), so the container keeps Docker's own
    # profile. Chromium still needs --no-sandbox for the same namespace reason
    # and the image passes it (Dockerfile). Do not re-add this line without a
    # ruling: it lifts the profile for every process in the container.
    env_file: .env
    environment:
      # Force the container-internal values even when .env carries the dev
      # equivalents (VIBERR_DATA_ROOT=./data, NODE_ENV=development).
      NODE_ENV: production
      VIBERR_DATA_ROOT: /data
      # No agent-backend credential is set here (ruling 127). Claude and Codex
      # are connected PER PERSON in the app, on Profile → Agent accounts: a
      # hosted sign-in through the bundled vendor binary, or a pasted API key /
      # ChatGPT workspace access token sealed in the database. Each person's
      # sign-in lands in /data/runtimes/users/<userId>/{claude-home,codex-home}
      # on the volume below, so it survives a recreate. An instance-wide key
      # would bill every run to whoever owns it, which is what the ruling
      # forbids.
      # --- Controller configuration locks (ruling 108) ---
      # The controller's skill / knowledge-base / MCP grants and its
      # instructions are LOCKED by default: the Controller settings tab shows
      # them read-only and a save that changes them is refused, org admins
      # included. Set a section to "enabled" (here or in .env) and recreate
      # the container to allow editing it in-app. "disabled" = locked (the
      # default shown); any value other than "enabled" keeps it locked.
      # Model and effort stay editable regardless, and the built-in viberr_ops
      # diagnostics server stays mounted and non-removable under every value.
      VIBERR_UNLOCK_CONTROLLER_SKILLS: "${VIBERR_UNLOCK_CONTROLLER_SKILLS:-disabled}"
      VIBERR_UNLOCK_CONTROLLER_KB: "${VIBERR_UNLOCK_CONTROLLER_KB:-disabled}"
      VIBERR_UNLOCK_CONTROLLER_MCPS: "${VIBERR_UNLOCK_CONTROLLER_MCPS:-disabled}"
      VIBERR_UNLOCK_CONTROLLER_INSTRUCTIONS: "${VIBERR_UNLOCK_CONTROLLER_INSTRUCTIONS:-disabled}"
    ports:
      # Compose interpolates ${PORT} from the same .env it injects into the
      # container, so the mapping always matches what the server listens on.
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      # Everything stateful lives under the data root: canonical project/task
      # markdown, SQLite projections + app DB, run logs, KBs, and each person's
      # agent-backend runtime home (runtimes/users/<userId>/…, ruling 127).
      # Back this up. Wiping it signs everyone out of Claude and Codex; they
      # reconnect on Profile → Agent accounts.
      #
      # Ruling 460: a NAMED volume, not a host directory. Every agent process
      # runs as its person's own OS user, and what keeps it out of the
      # projection database and other people's sign-ins is file permissions —
      # which a macOS bind mount (`./docker-data`) does not enforce between
      # uids at all (measured: uid 65534 read a 0600 file owned by 1000). A
      # store still on the bind mount boots `agentIsolation: degraded`. Moving
      # it once: `npm run store:to-volume` (docs/operations/deployment.md).
      - viberr-data:/data
    # A run is not the unit of load. The instance's run-concurrency cap counts
    # RUNS, and one run is an agent that will happily `pnpm -r test` — which
    # forks a vitest worker per host CPU. Measured on a 10-core / 16 GB Mac
    # with the cap at 0 (unlimited): six live runs, the container at 723% CPU
    # and 5.4 GB, host load average 18, and the machine's own UI stuttering.
    # Capping runs alone cannot fix that, because the multiplier is inside the
    # run.
    #
    # So the container gets a hard ceiling that the cap cannot overrun: some
    # cores stay for the person whose laptop this is. Tune `cpus` to your host
    # — roughly (cores - 3) — and remember it is a CEILING, not a reservation:
    # a quiet instance uses nothing.
    cpus: "7"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/resources/health').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  # Ruling 460: the store. Named `viberr-data` exactly (not project-prefixed),
  # so the one-time move, the backup and the runbook can name it.
  #
  # Ruling 473: EXTERNAL, so Compose never owns it. A volume Compose creates is
  # one `docker compose down -v` deletes, and this one is the whole store
  # (canonical files, the database, everyone's sealed credentials and sign-ins).
  # `npm run deploy` creates it when it is missing; by hand it is
  # `docker volume create viberr-data` before the first `up`.
  viberr-data:
    name: viberr-data
    external: true
