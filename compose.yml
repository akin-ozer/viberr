services:
  app:
    build: .
    # STABLE identity across container recreation (B-FD1): the data-root writer
    # lock records its holder's hostname, and a lock from a DIFFERENT host is
    # refused — the one host it cannot probe for liveness. Compose's default
    # hostname is the container id, so every `down && up` came back as a
    # stranger to its own leftover lock. Pinned, a recreated container probes
    # its predecessor's pid and reclaims a lock the shutdown could not release.
    hostname: viberr
    env_file: .env
    environment:
      # Force the container-internal values even when .env carries the dev
      # equivalents (VIBERR_DATA_ROOT=./data, NODE_ENV=development).
      NODE_ENV: production
      VIBERR_DATA_ROOT: /data
      # --- Run agents on a SUBSCRIPTION (no per-token API key) ---
      # Claude (Claude Pro/Max): run `claude setup-token` once on any machine,
      # put the token in .env as CLAUDE_CODE_OAUTH_TOKEN=... (env_file injects it).
      #
      # Codex state is isolated from the host's personal ~/.codex directory.
      # Preferred subscription auth is CODEX_ACCESS_TOKEN from .env
      # (ChatGPT Business/Enterprise; no Platform API billing). Other ChatGPT
      # plans use the CLI login (auth.json) — AUTO-SEEDED at boot from the
      # read-only /host-codex mount below when the volume lacks it, so a plain
      # `docker compose up` starts with Codex working even on a fresh/wiped
      # ./docker-data (the old recurring trap: only Codex silently degraded on
      # a wipe, because Claude's token rides .env while auth.json lived solely
      # on the volume). Manual fallback for hosts without ~/.codex:
      #   docker compose cp ~/.codex/auth.json app:/data/runtimes/codex-home/auth.json
      # — picked up live, no restart (availability re-probes). Without any
      # credential, Viberr reports Codex UNAVAILABLE (honest degraded state)
      # rather than starting a doomed run (F-DOCKER1). Sessions + the seeded
      # auth persist on the /data mount; host sessions are never imported.
      CODEX_HOME: /data/runtimes/codex-home
    ports:
      # Compose interpolates ${PORT} from the same .env it injects into the
      # container, so the mapping always matches what the server listens on.
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      # Everything stateful lives under the data root: canonical project/task
      # markdown, SQLite projections + app DB, run logs, KBs. Back this up.
      - ./docker-data:/data
      # Codex CLI auth auto-seed: the host's ~/.codex is mounted READ-ONLY at a
      # side path; the entrypoint copies auth.json into the writable
      # $CODEX_HOME only when the volume lacks it. A DIRECTORY mount (not the
      # file) because the CLI rewrites auth.json via rename — a file mount
      # would pin the dead inode and go silently stale. The container copy
      # stays self-managing afterwards (the SDK refreshes it). Set
      # CODEX_CLI_HOME to another path, or remove this line to opt out.
      - ${CODEX_CLI_HOME:-~/.codex}:/host-codex:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/resources/health').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
