services:
  app:
    build: .
    env_file: .env
    environment:
      # Force the container-internal values even when .env carries the dev
      # equivalents (VIBERR_DATA_ROOT=./data, NODE_ENV=development).
      NODE_ENV: production
      VIBERR_DATA_ROOT: /data
      # --- Run agents on a SUBSCRIPTION (no per-token API key) ---
      # Claude (Claude Pro/Max): run `claude setup-token` once on any machine,
      # put the token in .env as CLAUDE_CODE_OAUTH_TOKEN=... (env_file injects it).
      #
      # Codex (ChatGPT plan): the container reads the host's `codex login` from
      # the ~/.codex -> /codex mount below. Keyless — the Codex SDK uses that
      # login (and refreshes the OAuth token, since the mount is read-write).
      CODEX_HOME: /codex
      VIBERR_CODEX_USE_CLI_AUTH: "1"
    ports:
      # Compose interpolates ${PORT} from the same .env it injects into the
      # container, so the mapping always matches what the server listens on.
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      # Everything stateful lives under the data root: canonical project/task
      # markdown, SQLite projections + app DB, run logs, KBs. Back this up.
      - ./docker-data:/data
      # Codex subscription login: `codex login` on the host writes ~/.codex/
      # auth.json; mount it read-write (default) so the SDK can refresh the
      # OAuth token. The container runs as uid 1000 (node) — Docker Desktop bind
      # mounts are accessible regardless of host uid. Remove this line (and the
      # CODEX_HOME / VIBERR_CODEX_USE_CLI_AUTH env above) if you don't use Codex.
      - ${HOME}/.codex:/codex
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/resources/health').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
