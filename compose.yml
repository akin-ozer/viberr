services:
  app:
    build: .
    env_file: .env
    environment:
      # Force the container-internal values even when .env carries the dev
      # equivalents (VIBERR_DATA_ROOT=./data, NODE_ENV=development).
      NODE_ENV: production
      VIBERR_DATA_ROOT: /data
      # Local Compose has a stable public origin. Production deployments still
      # override this with BETTER_AUTH_URL from .env/reverse-proxy config.
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-http://127.0.0.1:${PORT:-3000}}"
      # --- Run agents on a SUBSCRIPTION (no per-token API key) ---
      # Claude (Claude Pro/Max): run `claude setup-token` once on any machine,
      # put the token in .env as CLAUDE_CODE_OAUTH_TOKEN=... (env_file injects it).
      #
      # Codex state is isolated from the host's personal ~/.codex directory.
      # Preferred subscription auth is CODEX_ACCESS_TOKEN from .env
      # (ChatGPT Business/Enterprise; no Platform API billing). Other ChatGPT
      # plans can copy only auth.json into the dedicated runtime directory;
      # see README. Sessions and auth stay on the existing /data backup mount.
      CODEX_HOME: /data/runtimes/codex-home
    ports:
      # Compose interpolates ${PORT} from the same .env it injects into the
      # container, so the mapping always matches what the server listens on.
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      # Everything stateful lives under the data root: canonical project/task
      # markdown, SQLite projections + app DB, run logs, KBs. Back this up.
      - ./docker-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/resources/health').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
